<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/jpeg" href="favicon.jpg">
<title>GTA VC MODS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2ecc71; --primary-hover:#31e07a; --primary-rgb:46,204,113;
  --text:#ffffff; --muted:rgba(255,255,255,.68); --body-bg:#121212;
  --glass:rgba(255,255,255,.06); --glass-strong:rgba(255,255,255,.11);
  --border:rgba(255,255,255,.16); --border-strong:rgba(255,255,255,.26);
  --orb1:rgba(46,204,113,.28); --orb2:rgba(52,152,219,.22);
  --shadow:0 18px 55px rgba(0,0,0,.4); --inset:inset 0 1px 0 rgba(255,255,255,.1);
  --on-primary:#06210f;
}
@media (prefers-color-scheme: light){
:root{
  --primary:#2980b9; --primary-hover:#3498db; --primary-rgb:41,128,185;
  --text:#2c3e50; --muted:rgba(44,62,80,.7); --body-bg:#e0e7ed;
  --glass:rgba(255,255,255,.6); --glass-strong:rgba(255,255,255,.8);
  --border:rgba(0,0,0,.1); --border-strong:rgba(255,255,255,.9);
  --orb1:rgba(41,128,185,.28); --orb2:rgba(46,204,113,.2);
  --shadow:0 18px 55px rgba(44,62,80,.18); --inset:inset 0 1px 0 rgba(255,255,255,.7);
  --on-primary:#ffffff;
}
}
/* Optional offline copy: put Lalezar-Regular.ttf in a fonts/ folder */
@font-face{font-family:"LalezarLocal";src:local("Lalezar"),url("fonts/Lalezar-Regular.ttf") format("truetype");font-display:swap}
:root{
  --font-fa:"Lalezar","LalezarLocal",Tahoma,sans-serif;
  --font-en:"Poppins","Segoe UI",Arial,sans-serif;
}
html[lang="fa"] body{font-family:var(--font-fa)}
html[lang="en"] body{font-family:var(--font-en)}

/* Language button always uses the font that matches its text */
html[lang="fa"] #langBtn{font-family:var(--font-en)}
html[lang="en"] #langBtn{font-family:var(--font-fa)}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  color:var(--text);
  background:var(--body-bg); min-height:100vh; line-height:1.7;
  padding:24px 16px; display:flex; justify-content:center; align-items:flex-start;
  overflow-x:hidden; position:relative; transition:background .35s,color .35s;
}
/* soft colored orbs behind the glass */
body::before,body::after{
  content:""; position:fixed; border-radius:50%; filter:blur(70px);
  pointer-events:none; z-index:0; transition:background .35s;
}
body::before{width:420px;height:420px;top:-120px;left:-100px;background:var(--orb1);animation:drift 16s ease-in-out infinite alternate}
body::after{width:480px;height:480px;bottom:-160px;right:-120px;background:var(--orb2);animation:drift 20s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(60px,40px) scale(1.12)}}

.container{
  position:relative; z-index:1; width:100%; max-width:960px; margin:16px auto;
  padding:30px; border-radius:28px; overflow:hidden;
  background:linear-gradient(180deg,var(--glass-strong),var(--glass));
  border:1px solid var(--border); border-top-color:var(--border-strong); border-left-color:var(--border-strong);
  -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
  box-shadow:var(--shadow),var(--inset);
}
.container::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.12),transparent 35%)}
.container>*{position:relative}

.top-bar{
  display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;
  padding-bottom:20px; margin-bottom:26px; border-bottom:1px solid var(--border);
}
.top-bar h1{font-size:clamp(24px,5vw,34px);text-shadow:0 2px 10px rgba(0,0,0,.2)}
.ctrl{display:flex;gap:10px}
.pill{
  min-height:42px; padding:9px 18px; border-radius:14px; cursor:pointer;
  font:inherit; font-weight:700; color:var(--text);
  background:linear-gradient(180deg,var(--glass-strong),var(--glass));
  border:1px solid var(--border); box-shadow:var(--inset);
  transition:transform .2s,background .2s,color .2s,box-shadow .2s;
}
.pill:hover{transform:translateY(-2px);background:var(--primary);color:var(--on-primary);box-shadow:0 10px 24px rgba(var(--primary-rgb),.35)}

.intro{text-align:center;margin-bottom:30px}
.intro h2{font-size:clamp(20px,4vw,26px);margin-bottom:8px}
.intro p{color:var(--muted);max-width:56ch;margin:0 auto}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{
  display:flex; flex-direction:column; gap:12px; padding:18px; border-radius:20px;
  background:linear-gradient(180deg,var(--glass-strong),var(--glass));
  border:1px solid var(--border); box-shadow:var(--inset);
  transition:transform .25s,border-color .25s,box-shadow .25s;
}
.card:hover{transform:translateY(-5px);border-color:rgba(var(--primary-rgb),.7);box-shadow:0 16px 36px rgba(var(--primary-rgb),.22),var(--inset)}
.card h3{font-size:19px;line-height:1.3;font-weight:400}
.ver{display:block;font-size:13px;color:var(--primary);font-weight:700}
.card p{color:var(--muted);font-size:14.5px;flex:1}
.dl{
  display:flex; justify-content:center; align-items:center; gap:8px; padding:12px 16px;
  border-radius:14px; text-decoration:none; font-weight:700; color:var(--text);
  background:linear-gradient(180deg,var(--glass-strong),var(--glass)); border:1px solid var(--border);
  transition:background .2s,color .2s,transform .2s,box-shadow .2s;
}
.card:hover .dl,.dl:hover{background:var(--primary);color:var(--on-primary);border-color:transparent}
.dl:hover{box-shadow:0 10px 24px rgba(var(--primary-rgb),.35)}


#toast{
  position:fixed; top:0; left:0; width:100%; padding:14px; z-index:30; text-align:center;
  font-weight:700; font-size:17px; color:#fff; background:rgba(var(--primary-rgb),.88);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  opacity:0; transform:translateY(-100%); transition:opacity .35s,transform .35s; box-shadow:0 10px 24px rgba(0,0,0,.25);
}
#toast.show{opacity:1;transform:translateY(0)}

a:focus-visible,button:focus-visible{outline:3px solid var(--primary-hover);outline-offset:3px}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root{--glass:rgba(40,40,40,.92);--glass-strong:rgba(55,55,55,.95)}
  @media (prefers-color-scheme: light){:root{--glass:rgba(255,255,255,.95);--glass-strong:#fff}}
}
@media(max-width:520px){
  .container{padding:20px;border-radius:22px}
  .top-bar{justify-content:center;text-align:center}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="toast"></div>
<div class="container">
  <div class="top-bar">
    <h1 data-i18n="title"></h1>
    <div class="ctrl">
      <button class="pill" id="langBtn" type="button">EN</button>
    </div>
  </div>

  <div class="intro">
    <p data-i18n="lead"></p>
  </div>

  <div class="grid" id="tools"></div>

</div>

<script>
var TOOLS = [
  {file:"CollEditor_GTA-VC-MODS.rar", name:"CollEditor", ver:"v1.1 Beta",
   fa:"ویرایش فایل‌های برخورد (.col) ماشین‌ها و ساختمان‌ها", en:"Edit collision (.col) files for vehicles and buildings"},
  {file:"IMG Tool_GTA-VC-MODS.rar", name:"IMG Tool", ver:"v2.0",
   fa:"باز کردن آرشیو IMG و جایگزینی فایل‌های .dff و .txd", en:"Open IMG archives and replace .dff and .txd files"},
  {file:"Magic.TXD_GTA-VC-MODS.rar", name:"Magic TXD", ver:"v4.5",
   fa:"ویرایش و تبدیل تکسچرها در فایل‌های TXD", en:"Edit and convert textures inside TXD files"},
  {file:"TXD Workshop 4.0_GTA-VC-MODS.rar", name:"TXD Workshop", ver:"4.0",
   fa:"مدیریت و ویرایش سریع تکسچرهای TXD", en:"Quickly manage and edit TXD textures"},
  {file:"Vice City Mod Manager_GTA-VC-MODS.rar", name:"Vice City Mod Manager", ver:"v1.0",
   fa:"نصب و مدیریت مادها بدون دست‌کاری فایل‌های بازی", en:"Install and manage mods without touching game files"},
  {file:"ZModeler 2.2.6_GTA-VC-MODS.rar", name:"ZModeler", ver:"v2.2.6",
   fa:"ساخت و ویرایش مدل‌های سه‌بعدی (.dff)", en:"Build and edit 3D models (.dff)"}
];

var I18N = {
  fa:{
    title:"برنامه‌های کاربردی برای مادسازی GTA VC",
    lead:"همه ابزارهایی که برای ساخت، ویرایش و نصب مد در GTA Vice City لازم دارید، یک‌جا و رایگان.",
    download:"دانلود", toast:"در حال دانلود...",
    other:"EN"
  },
  en:{
    title:"Helpful apps for GTA VC modding",
    lead:"Everything you need to create, edit and install mods for GTA Vice City, in one place and free to download.",
    download:"Download", toast:"Downloading...",
    other:"فارسی"
  }
};

var lang = "fa", root = document.documentElement;

function store(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

function render(){
  var t = I18N[lang];
  root.lang = lang;
  root.dir = lang === "fa" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    el.textContent = t[el.getAttribute("data-i18n")];
  });
  document.title = t.title;
  document.getElementById("langBtn").textContent = t.other;
  var grid = document.getElementById("tools");
  grid.innerHTML = "";
  TOOLS.forEach(function(x){
    var card = document.createElement("div");
    card.className = "card";

    var title = document.createElement("h3");
    title.textContent = x.name;
    var ver = document.createElement("span");
    ver.className = "ver";
    ver.textContent = x.ver;
    title.appendChild(ver);

    var p = document.createElement("p");
    p.textContent = x[lang];

    var a = document.createElement("a");
    a.className = "dl";
    a.href = x.file;
    a.setAttribute("download", "");
    a.textContent = t.download;
    a.addEventListener("click", showToast);

    card.appendChild(title); card.appendChild(p); card.appendChild(a);
    grid.appendChild(card);
  });
}

function showToast(){
  var el = document.getElementById("toast");
  el.textContent = I18N[lang].toast;
  el.classList.add("show");
  setTimeout(function(){ el.classList.remove("show"); }, 3000);
}

document.getElementById("langBtn").addEventListener("click", function(){
  lang = lang === "fa" ? "en" : "fa";
  store("lang", lang);
  render();
});

if(load("lang") === "en") lang = "en";
render();
</script>
</body>
</html>
